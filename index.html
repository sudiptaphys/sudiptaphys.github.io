    },

    setStatus(text, tone) {
      if ($("status-text").textContent !== text) $("status-text").textContent = text;
      $("status").dataset.tone = tone;
    },

    initBar() {
      const zoneStart = Math.min(1, cfg.TARGET_RPM / cfg.DISPLAY_MAX_RPM) * 100;
      $("bar-zone").style.left = zoneStart + "%";
      $("bar-marker").style.left = zoneStart + "%";
      $("bar-target-label").style.left = zoneStart + "%";
      $("bar-target-label").textContent = String(cfg.TARGET_RPM);
      $("stat-target-l").textContent = `At ${cfg.TARGET_RPM}+ RPM`;
      $("speed-line").hidden = !cfg.HUD_VIDEO_SPEED;
      $("video").style.objectFit = cfg.VIDEO_FIT;
      $("sim-slider").max = String(cfg.SIM_MAX_RPM);
    },

    lastShown: {},
    barGreen: false,
    renderCadence(cad, playback, hasVideo, inZone) {
      const rpmText = cad.source === "bike" && cad.stale ? "–" : String(Math.round(cad.rpm));
      if (this.lastShown.rpm !== rpmText) { $("rpm").textContent = rpmText; this.lastShown.rpm = rpmText; }

      const pct = Math.min(1, cad.rpm / cfg.DISPLAY_MAX_RPM) * 100;
      const fill = $("bar-fill");
      const widthText = pct.toFixed(1) + "%";
      if (this.lastShown.width !== widthText) { fill.style.width = widthText; this.lastShown.width = widthText; }
      // Green at the target; stays green for small (1 RPM) wobbles below it, and while in the zone.
      this.barGreen = inZone || cad.rpm >= cfg.TARGET_RPM || (this.barGreen && cad.rpm >= cfg.TARGET_RPM - 1);
      fill.classList.toggle("in-zone", this.barGreen);

      let line;
      if (!hasVideo) line = "No video chosen";
      else if (playback.playing) line = "Video speed " + playback.rate.toFixed(2) + "×";
      else line = "Video paused – pedal to go";
      if (this.lastShown.line !== line) { $("speed-line").textContent = line; this.lastShown.line = line; }
    },
  };

  // -------------------------------------------------------------------
  // Bike connection (Web Bluetooth). Notifications only: no reads, no writes.
  // -------------------------------------------------------------------
  const Bike = {
    device: null,
    characteristic: null,
    state: "idle",            // idle | requesting | connecting | connected | reconnecting
    userDisconnected: false,
    busy: false,
    retryTimer: null,
    retryIndex: 0,
    attempts: 0,
    lastCadence: null,
    lastCadenceAt: null,
    packets: 0,
    listening: new WeakSet(),
    onChange: () => {},

    supported() { return window.isSecureContext && "bluetooth" in navigator; },

    setState(s) { this.state = s; this.onChange(); },

    // Called from the "Connect bike" button (needs the user's click).
    async choose() {
      if (!this.supported()) { App.showUnsupported(); return; }
      UI.clearMessage("bike");
      this.setState("requesting");
      let device;
      try {
        device = await navigator.bluetooth.requestDevice({
          // Either filter is enough (filters are OR'd): the FTMS service UUID is in the
          // advertising packet, the name "AirBike" is in the scan response.
          filters: [{ services: [FTMS.SERVICE] }, { name: FTMS.DEVICE_NAME }],
          optionalServices: [FTMS.SERVICE],
        });
      } catch (err) {
        this.setState("idle");
        this.reportRequestError(err);
        return;
      }
      if (this.device && this.device !== device) this.forgetCurrent();
      this.device = device;
      if (!this.listening.has(device)) {
        this.listening.add(device);
        // Only react if this is still the current bike (ignore events from a replaced device).
        device.addEventListener("gattserverdisconnected", () => { if (device === this.device) this.onDisconnected(); });
      }
      this.userDisconnected = false;
      this.retryIndex = 0;
      this.attempts = 0;
      this.tryConnect(false);
    },

    reportRequestError(err) {
      const name = err && err.name, msg = (err && err.message) || "";
      console.warn("requestDevice failed:", name, msg);
      if (name === "NotFoundError" && /cancel/i.test(msg)) {
        UI.showMessage("bike", "No bike was chosen. Press Connect bike and pick “AirBike” from the list.", "info");
      } else if (/adapter|bluetooth is (off|disabled)|not available/i.test(msg)) {
        UI.showMessage("bike", "Bluetooth is turned off or not available on this device. Turn Bluetooth on, then press Connect bike again.", "error");
      } else if (name === "NotAllowedError" || name === "SecurityError" || /permission|denied|blocked|globally disabled/i.test(msg)) {
        UI.showMessage("bike", "Bluetooth permission was denied. Allow Bluetooth for this site in Chrome (lock icon › Site settings). On Android also allow Chrome “Nearby devices” (and Location on older Android). Then try again.", "error");
      } else if (name === "NotFoundError") {
        UI.showMessage("bike", "Bike not found. Check the bike sensor has power and is close by, and close Kinomap or any other app using the bike – only one app can connect at a time.", "error");
      } else {
        UI.showMessage("bike", "Could not start the Bluetooth search (" + (name || "error") + "). Please try again.", "error");
      }
    },

    // One attempt to open the GATT connection and subscribe.
    async tryConnect(isRetry) {
      if (!this.device || this.busy) return;
      this.busy = true;
      this.attempts += 1;
      this.setState(isRetry ? "reconnecting" : "connecting");
      const device = this.device;
      try {
        const server = await withTimeout(device.gatt.connect(), cfg.CONNECT_TIMEOUT_MS, () => {
          try { device.gatt.disconnect(); } catch (_) { /* ignore */ }
        });
        const service = await server.getPrimaryService(FTMS.SERVICE);
        const ch = await service.getCharacteristic(FTMS.INDOOR_BIKE_DATA);
        if (this.characteristic) this.characteristic.removeEventListener("characteristicvaluechanged", this.onValue);
        ch.addEventListener("characteristicvaluechanged", this.onValue);
        await ch.startNotifications();
        if (this.userDisconnected || device !== this.device) { try { device.gatt.disconnect(); } catch (_) {} return; }
        this.characteristic = ch;
        this.retryIndex = 0;
        this.attempts = 0;
        UI.clearMessage("bike");
        this.setState("connected");
      } catch (err) {
        console.warn("connect attempt failed:", err && err.name, err && err.message);
        if (this.userDisconnected || device !== this.device) return;
        if (err && err.name === "NotFoundError") {
          // The device has no FTMS service / Indoor Bike Data: wrong device, don't keep retrying.
          UI.showMessage("bike", "That device isn't sending bike data. Press Connect bike and choose “AirBike”.", "error");
          try { device.gatt.disconnect(); } catch (_) {}
          this.setState("idle");
          return;
        }
        this.scheduleReconnect();
      } finally {
        this.busy = false;
      }
    },

    onValue: (event) => {
      const result = parseIndoorBikeData(event.target.value);
      Bike.packets += 1;
      if (!result.ok) { console.warn("Indoor Bike Data ignored:", result.error); return; }
      if (typeof result.instantaneousCadenceRpm === "number") {
        Bike.lastCadence = result.instantaneousCadenceRpm;
        Bike.lastCadenceAt = performance.now();
        // Speed comes in the same packet (AirBike.ino: cadence x 20 / 60 km/h). Used for distance.
        Bike.lastSpeed = typeof result.instantaneousSpeedKmh === "number" ? result.instantaneousSpeedKmh : null;
      }
    },

    onDisconnected() {
      console.info("Bike disconnected");
      if (this.userDisconnected) { this.setState("idle"); return; }
      if (this.busy) return;   // the running attempt will schedule the next try
      this.scheduleReconnect();
    },

    scheduleReconnect() {
      clearTimeout(this.retryTimer);
      const delays = cfg.RECONNECT_DELAYS_MS;
      const delay = delays[Math.min(this.retryIndex, delays.length - 1)];
      this.retryIndex += 1;
      this.setState("reconnecting");
      UI.showMessage("bike", `Bike disconnected – trying to reconnect (try ${this.attempts + 1})… If this keeps happening, check the bike sensor has power and that Kinomap is closed.`, "warn", { dismissible: false });
      this.retryTimer = setTimeout(() => this.tryConnect(true), delay);
    },

    // "Reconnect now" button: skip the wait. Uses the same bike, no chooser.
    reconnectNow() {
      if (!this.device) { this.choose(); return; }
      clearTimeout(this.retryTimer);
      this.userDisconnected = false;
      this.retryIndex = 0;
      this.tryConnect(true);
    },

    disconnect() {
      this.userDisconnected = true;
      clearTimeout(this.retryTimer);
      this.lastCadenceAt = null;
      UI.clearMessage("bike");
      if (this.device && this.device.gatt.connected) this.device.gatt.disconnect(); // fires gattserverdisconnected
      this.setState("idle");
    },

    forgetCurrent() {
      clearTimeout(this.retryTimer);
      const old = this.device;
      this.device = null;          // set first, so the old device's disconnect event is ignored
      this.characteristic = null;
      this.lastCadenceAt = null;
      if (old && old.gatt.connected) old.gatt.disconnect();
    },
  };

  function withTimeout(promise, ms, onTimeout) {
    let timer;
    const timeout = new Promise((_, reject) => {
      timer = setTimeout(() => { onTimeout && onTimeout(); reject(new DOMException("Connection timed out", "TimeoutError")); }, ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
  }

  // -------------------------------------------------------------------
  // Simulator
  // -------------------------------------------------------------------
  const Sim = {
    on: false,
    rpm: 0,
    toggle() {
      this.on = !this.on;
      $("sim-panel").hidden = !this.on;
      $("sim-badge").hidden = !this.on;
      $("btn-sim").classList.toggle("sim-on", this.on);
      $("btn-sim").setAttribute("aria-pressed", String(this.on));
      $("btn-sim").textContent = this.on ? "Simulator on" : "Simulator";
      App.refreshStatus();
    },
    set(v) {
      this.rpm = Number(v) || 0;
      $("sim-value").textContent = this.rpm + " RPM";
    },
  };

  // -------------------------------------------------------------------
  // Video speed control
  // -------------------------------------------------------------------
  const VideoController = {
    el: null,
    url: null,
    hasVideo: false,
    state: { rate: 0, playing: false, stoppingFor: 0 },
    playPending: false,

    init() {
      this.el = $("video");
      this.el.muted = true;   // music comes in a later step
      this.el.addEventListener("error", () => {
        if (!this.hasVideo) return;
        UI.showMessage("video", "This video can't be played in Chrome. MP4 files (H.264 video) work best.", "error");
      });
    },

    load(file) {
      if (this.url) URL.revokeObjectURL(this.url);
      this.url = URL.createObjectURL(file);
      UI.clearMessage("video");
      this.hasVideo = true;
      this.state = { rate: 0, playing: false, stoppingFor: 0 };
      this.el.src = this.url;   // loading resets playbackRate to defaultPlaybackRate; tick() re-applies it
      $("app").classList.add("has-video");
    },

    tick(dt, targetRate) {
      const next = stepPlayback(this.state, targetRate, dt, cfg);
      this.state = next;
      if (!this.hasVideo || this.el.readyState < 1 /* HAVE_METADATA */ || this.el.error) return;

      if (next.playing) {
        const r = Math.min(cfg.BROWSER_MAX_RATE, Math.max(cfg.BROWSER_MIN_RATE, next.rate));
        if (Math.abs(this.el.playbackRate - r) > 0.004) {
          try { this.el.playbackRate = r; } catch (e) { console.warn("playbackRate rejected", r, e.name); }
        }
        if (this.el.paused && !this.playPending) {
          this.playPending = true;
          this.el.play().then(() => {
            this.playPending = false;
            UI.clearMessage("play");
          }).catch((e) => {
            this.playPending = false;
            if (e && e.name === "NotAllowedError") UI.showMessage("play", "Tap the screen once to let the video play.", "info");
            else if (e && e.name !== "AbortError") console.warn("play() failed", e);
          });
        }
      } else if (!this.el.paused) {
        this.el.pause();
      }
    },
  };

  // -------------------------------------------------------------------
  // Effects layer: fog -> colour, zone ring, streak timer, warm bonus glow.
  // Everything eases slowly; nothing flashes.
  // -------------------------------------------------------------------
  const Effects = {
    zone: { ...NEW_ZONE },
    clarity: 1,
    glow: 0,
    bonus: false,
    preview: { rpm: null, glow: false },   // set by the Settings screen while adjusting
    glowIsPreview: false,
    last: { filter: "", haze: -1, glow: -1, streak: "", classes: "" },

    init() { this.clarity = cfg.VISUAL_REWARD ? 0 : 1; },

    update({ rpm, dt }) {
      this.zone = stepZone(this.zone, rpm, dt, cfg);
      this.bonus = bonusActive(this.zone, cfg);

      let target, rise = cfg.CLARITY_RISE_SECONDS, fall = cfg.CLARITY_FALL_SECONDS;
      if (this.preview.rpm != null) { target = clarityTarget(this.preview.rpm, false, cfg); rise = fall = 0.3; }
      else target = clarityTarget(rpm, this.zone.inZone, cfg);
      this.clarity = easeToward(this.clarity, target, dt, rise, fall);

      // A glow shown only as a Settings preview appears and disappears quickly; the real reward fades slowly.
      if (this.preview.glow) this.glowIsPreview = true;
      if (this.bonus || this.glow === 0) this.glowIsPreview = this.preview.glow;
      const glowFade = this.glowIsPreview ? 0.6 : cfg.GLOW_FADE_SECONDS;
      const glowOn = cfg.BONUS_GLOW && (this.preview.glow || this.bonus);
      this.glow = easeToward(this.glow, glowOn ? 1 : 0, dt, glowFade, glowFade);

      this.apply(lookFor(this.clarity, this.glow, cfg));
      this.renderZone();
    },

    apply(look) {
      const L = this.last;
      if (look.filter !== L.filter) { $("video").style.filter = look.filter === "none" ? "" : look.filter; L.filter = look.filter; }
      if (Math.abs(look.haze - L.haze) > 0.002) { $("haze").style.opacity = String(look.haze); L.haze = look.haze; }
      if (Math.abs(look.glow - L.glow) > 0.002) {
        $("glow").style.opacity = String(look.glow);
        $("glow-edge").style.opacity = String(look.glow);
        L.glow = look.glow;
      }
    },

    renderZone() {
      const z = this.zone;
      const classes = (z.inZone ? "zone" : "") + (this.bonus ? " bonus" : "");
      if (classes !== this.last.classes) {
        $("cadence").classList.toggle("zone", z.inZone && !this.bonus);
        $("cadence").classList.toggle("bonus", this.bonus);
        $("streak").classList.toggle("bonus", this.bonus);
        this.last.classes = classes;
      }
      const showStreak = cfg.SHOW_STREAK && z.inZone;
      $("streak").classList.toggle("show", showStreak);
      if (z.inZone) {
        const s = Math.floor(z.streak);
        const text = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        if (text !== this.last.streak) { $("streak-time").textContent = text; this.last.streak = text; }
      }
    },
  };

  // (Step 3) Audio module will go here, fed from the same tick.

  // -------------------------------------------------------------------
  // Saved rides (localStorage on this device). Each ride is about 3 KB.
  // -------------------------------------------------------------------
  const RideStore = {
    KEY: "airbike.rides.v1",
    ACTIVE_KEY: "airbike.activeRide.v1",
    list: [],
    available: true,
    persistAsked: false,

    load() {
      try {
        const raw = window.localStorage.getItem(this.KEY);
        const arr = raw ? JSON.parse(raw) : [];
        this.list = (Array.isArray(arr) ? arr : []).map((r) => sanitizeRide(r)).filter(Boolean).sort((a, b) => a.startedAt - b.startedAt);
        this.available = true;
      } catch (err) {
        console.warn("Saved rides could not be loaded:", err.name);
        this.list = [];
        this.available = err instanceof SyntaxError;
      }
    },
    write() {
      try {
        window.localStorage.setItem(this.KEY, JSON.stringify(this.list));
        this.available = true;
        return true;
      } catch (err) {
        console.warn("Rides could not be saved:", err.name);
        this.available = false;
        return false;
      }
    },
    add(ride) {
      if (this.list.some((r) => r.id === ride.id)) return true;
      this.list.push(ride);
      this.list.sort((a, b) => a.startedAt - b.startedAt);
      if (!this.write()) { this.list = this.list.filter((r) => r.id !== ride.id); return false; }
      this.askToPersist();
      return true;
    },
    remove(id) { this.list = this.list.filter((r) => r.id !== id); this.write(); },
    clear() { this.list = []; this.write(); },
    // Ask the browser not to clear this site's data under storage pressure (Chrome decides automatically).
    askToPersist() {
      if (this.persistAsked || !navigator.storage || !navigator.storage.persist) return;
      this.persistAsked = true;
      navigator.storage.persist().then((ok) => console.info("Persistent storage:", ok)).catch(() => {});
    },
    // The ride in progress (or a finished one waiting for Save / Don't save), so a reload doesn't lose it.
    saveActive(value) {
      try {
        if (value) window.localStorage.setItem(this.ACTIVE_KEY, JSON.stringify(value));
        else window.localStorage.removeItem(this.ACTIVE_KEY);
      } catch (_) { /* storage blocked: nothing to keep */ }
    },
    loadActive() {
      try {
        const v = JSON.parse(window.localStorage.getItem(this.ACTIVE_KEY) || "null");
        if (v && v.pending) { const p = sanitizeRide(v.pending); return p ? { pending: p } : null; }
        if (v && v.ride) { const r = sanitizeRide(v.ride, true); return r ? { ride: { ...v.ride, ...r } } : null; }
      } catch (_) { /* ignore */ }
      return null;
    },
  };

  // -------------------------------------------------------------------
  // Ride session: Start -> (Pause/Resume) -> Finish -> summary -> Save / Don't save
  // -------------------------------------------------------------------
  const Session = {
    ride: null,
    state: "none",          // none | active | paused
    lastPersist: 0,
    shown: {},

    start() {
      if (this.state !== "none") return;
      this.ride = newRide(Date.now(), cfg);
      this.state = "active";
      UI.clearMessage("ride");
      this.persist();
      this.render();
      Controls.show();
    },
    togglePause() {
      if (this.state === "active") { this.state = "paused"; this.persist(); }
      else if (this.state === "paused") { this.state = "active"; UI.clearMessage("ride"); }
      this.render();
    },
    finish() {
      if (!this.ride) return;
      const record = finishRide(this.ride, Date.now());
      this.ride = null;
      this.state = "none";
      RideStore.saveActive({ pending: record });
      UI.clearMessage("ride");
      this.render();
      Summary.open(record, "new");
    },
    update(input, dt) {
      if (this.state === "none" && cfg.AUTO_START && input.rpm > 0 && !Summary.isOpen) this.start();
      if (this.state === "active") {
        stepRide(this.ride, input, dt, cfg);
        if (performance.now() - this.lastPersist > cfg.RIDE_AUTOSAVE_MS) this.persist();
      }
      this.render();
    },
    persist() {
      if (!this.ride) return;
      this.ride.endedAt = Date.now();
      RideStore.saveActive({ ride: this.ride });
      this.lastPersist = performance.now();
    },
    restore() {
      const a = RideStore.loadActive();
      if (!a) return;
      if (a.pending) { Summary.open(a.pending, "new"); return; }
      this.ride = a.ride;
      this.state = "paused";
      const t = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(a.ride.startedAt);
      UI.showMessage("ride", `Your ride from ${t} was kept. Press Resume to carry on, or Finish to see how it went.`, "info");
      this.render();
    },
    set(id, prop, value) {
      const key = id + "." + prop;
      if (this.shown[key] === value) return;
      this.shown[key] = value;
      if (prop === "text") $(id).textContent = value; else $(id)[prop] = value;
    },
    render() {
      const s = this.state, r = this.ride;
      this.set("btn-start", "hidden", s !== "none");
      this.set("btn-pause", "hidden", s === "none");
      this.set("btn-finish", "hidden", s === "none");
      this.set("btn-pause", "text", s === "paused" ? "Resume" : "Pause");
      $("btn-pause").classList.toggle("go", s === "paused");
      const any = cfg.HUD_TIME || cfg.HUD_TARGET_TIME || cfg.HUD_DISTANCE;
      this.set("stats", "hidden", !(any && r));
      this.set("stat-time", "hidden", !cfg.HUD_TIME);
      this.set("stat-target", "hidden", !cfg.HUD_TARGET_TIME);
      this.set("stat-dist", "hidden", !cfg.HUD_DISTANCE);
      $("stats").classList.toggle("paused", s === "paused");
      const hint = s === "none" ? (any ? "Press Start ride to record time and distance" : "")
        : s === "paused" ? "Paused. Press Resume to carry on." : "";
      this.set("stats-hint", "text", hint);
      this.set("stats-hint", "hidden", !hint);
      $("stats-hint").classList.toggle("paused", s === "paused");
      if (r) {
        this.set("stat-time-v", "text", fmtDuration(r.elapsedS));
        this.set("stat-target-v", "text", fmtDuration(r.atTargetS));
        const d = fmtDistance(r.distanceM, cfg.DISTANCE_UNIT);
        this.set("stat-dist-v", "text", d.value);
        this.set("stat-dist-u", "text", d.unit);
      }
    },
  };

  // -------------------------------------------------------------------
  // Ride summary: goal rings, numbers vs last ride, awards, cadence chart,
  // recent rides, next goal. What's shown is chosen in Settings > Ride summary.
  // -------------------------------------------------------------------
  // Ring colours checked with the data-viz palette validator on this dark background
  // (lightness, chroma, colour-blind separation, contrast: all pass).
  const RING = { time: "#3987e5", target: "#199e70", distance: "#d95926" };
  const GLYPHS = {
    star: '<path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9-4.4-4.1 6-.8z" fill="currentColor"/>',
    target: '<circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>',
    flame: '<path d="M12 2.8c.6 3-1.8 4.6-1.8 7 0 1.1.7 2 1.8 2 1.4 0 2-1.3 1.6-3 2.5 1.6 4 4 4 6.5A5.6 5.6 0 0 1 12 21a5.6 5.6 0 0 1-5.6-5.7c0-4.4 4.7-6.6 5.6-12.5z" fill="currentColor"/>',
    route: '<path d="M6 20c0-5 12-4 12-9s-6-4-6-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="6" cy="20" r="2" fill="currentColor"/><circle cx="12" cy="4" r="2" fill="currentColor"/>',
    timer: '<circle cx="12" cy="13.5" r="7.4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 13.5V9.6M9.6 2.9h4.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    bolt: '<path d="M13.5 2.5L5.5 13.5h5.5l-1 8 8-11h-5.5z" fill="currentColor"/>',
    rings: '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.9" fill="none" stroke="currentColor" stroke-width="2"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>',
    sun: '<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M5.4 18.6l1.5-1.5M17.1 6.9l1.5-1.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    calendar: '<rect x="4" y="5.5" width="16" height="14.5" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    medal: '<circle cx="12" cy="14" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M8.5 3.5l3.5 5 3.5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
  };
  const svgNS = "http://www.w3.org/2000/svg";
  const fmtDate = (ms, opts) => new Intl.DateTimeFormat(undefined, opts).format(ms);

  const Summary = {
    el: null,
    isOpen: false,
    ride: null,
    mode: null,          // "new" (just finished) | "view" (from history)
    decided: false,
    confirmTimer: null,

    init() {
      this.el = $("summary");
      this.el.addEventListener("cancel", (e) => {
        e.preventDefault();
        if (this.mode !== "new" || this.decided) this.close();   // a new ride needs Save or Don't save
      });
      // If the browser closes it anyway (e.g. Esc pressed repeatedly), never lose the ride: save it.
      this.el.addEventListener("close", () => {
        if (!this.isOpen) return;
        this.isOpen = false;
        this.el.classList.remove("open", "revealed");
        if (this.mode === "new" && !this.decided) { if (this.save(true)) UI.showMessage("saved", "Your ride was saved.", "info"); }
      });
      if ("ResizeObserver" in window) new ResizeObserver(() => { if (this.isOpen) this.drawCharts(); }).observe(this.el);
    },

    open(ride, mode) {
      this.ride = ride;
      this.mode = mode;
      this.decided = false;
      this.isOpen = true;
      this.render();
      if (!this.el.open) this.el.showModal();
      this.el.querySelector(".sum-scroll").scrollTop = 0;
      this.drawCharts();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        this.el.classList.add("open");
        this.el.querySelectorAll(".ring-progress").forEach((c) => { c.style.strokeDashoffset = c.dataset.offset; });
        setTimeout(() => this.el.classList.add("revealed"), 700);
      }));
      Controls.show();
    },

    close() {
      if (!this.isOpen) return;
      this.isOpen = false;
      this.el.classList.remove("open", "revealed");
      setTimeout(() => { if (this.el.open && !this.isOpen) this.el.close(); }, 450);
      Controls.show();
      if (SettingsSheet.isOpen) SettingsSheet.refresh();
    },

    save(silent) {
      if (!RideStore.add(this.ride)) {
        if (!silent) this.renderActions("Couldn't save: this browser isn't letting the app store data.");
        return false;
      }
      this.decided = true;
      RideStore.saveActive(null);
      if (!silent) this.renderActions();
      return true;
    },

    // ---------- building the page ----------
    render() {
      const r = this.ride, c = cfg;
      const others = RideStore.list.filter((p) => p.id !== r.id);
      const earlier = others.filter((p) => p.simulator === r.simulator && p.startedAt < r.startedAt);
      const last = earlier[earlier.length - 1] || null;
      const awards = rideAwards(r, others, c);
      const head = rideHeadline(r, awards);
      const body = $("sum-body");
      body.textContent = "";

      const date = h("p", { class: "sum-date", text: fmtDate(r.startedAt, { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" }) });
      if (r.simulator) date.append(h("span", { class: "tag", text: "Simulator ride" }));
      body.append(date, h("h1", { class: "sum-title", id: "sum-title", text: head.title }), h("p", { class: "sum-sub", text: head.sub }));

      const grid = h("div", { class: "sum-grid" });
      body.append(grid);
      if (c.SUM_RINGS) grid.append(this.ringsCard(r));
      const tiles = this.tiles(r, earlier, last);
      if (tiles) grid.append(tiles);
      if (c.SUM_AWARDS && awards.length) grid.append(this.awardsCard(awards));
      if (c.SUM_CHART) grid.append(h("section", { class: "card chart-card", "data-section": "chart" }, [
        h("h2", { class: "card-title", text: "Cadence" }),
        h("p", { class: "card-sub", text: `Average ${Math.round(r.avgRpm)} RPM while pedalling. The shaded band is ${r.targetRpm} RPM and above.` }),
        h("div", { class: "chart", id: "chart-cadence" }),
      ]));
      const recent = earlier.concat(r).slice(-10);
      if (c.SUM_RECENT) grid.append(h("section", { class: "card recent-card", "data-section": "recent" }, [
        h("h2", { class: "card-title", text: "Time at target" }),
        h("p", { class: "card-sub", text: recent.length > 1 ? `Your last ${recent.length} rides, minutes at ${r.targetRpm}+ RPM` : "This ride. Your next rides will appear here." }),
        h("div", { class: "chart", id: "chart-recent" }),
      ]));
      if (c.SUM_NEXT_GOAL) {
        const g = nextGoal(r, c);
        const card = h("section", { class: "card next-card", "data-section": "next" }, [
          h("div", { class: "next-icon", html: `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS.target}</svg>` }),
          h("p", { class: "card-sub", text: "Next time" }),
          h("div", { class: "next-title", text: g.title }),
          h("div", { class: "next-detail", text: g.detail }),
        ]);
        if (!c.SUM_RECENT) card.style.gridColumn = "span 12";
        grid.append(card);
      }
      const all = others.filter((p) => p.simulator === r.simulator).concat(r);
      const total = all.reduce((s, p) => s + p.distanceM, 0);
      const td = fmtDistance(total, c.DISTANCE_UNIT);
      grid.append(h("p", { class: "sum-lifetime", text: `${all.length} ${all.length === 1 ? "ride" : "rides"} and ${td.value} ${td.unit} so far${r.simulator ? " in the simulator" : ""}.` }));

      this.recentData = recent;
      this.renderActions();
    },

    ringsCard(r) {
      const c = cfg, unit = c.DISTANCE_UNIT;
      const goalDist = fmtDistance(c.GOAL_DISTANCE_KM * 1000, unit);
      const d = fmtDistance(r.distanceM, unit);
      const items = [
        { key: "time", label: "Ride time", value: fmtDuration(r.elapsedS), goal: `/ ${fmtMinutes(c.GOAL_TIME_MIN * 60)}`, p: r.elapsedS / (c.GOAL_TIME_MIN * 60) },
        { key: "target", label: `At ${r.targetRpm}+ RPM`, value: fmtDuration(r.atTargetS), goal: `/ ${fmtMinutes(c.GOAL_TARGET_MIN * 60)}`, p: r.atTargetS / (c.GOAL_TARGET_MIN * 60) },
        { key: "distance", label: "Distance", value: `${d.value}`, goal: `/ ${goalDist.value.replace(/\.?0+$/, "")} ${d.unit}`, p: r.distanceM / (c.GOAL_DISTANCE_KM * 1000) },
      ];
      // concentric rings: outer = ride time, middle = time at target, inner = distance
      const size = 240, mid = size / 2, sw = 22, gap = 5;
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
      svg.setAttribute("class", "rings");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", items.map((i) => `${i.label} ${Math.round(i.p * 100)}% of goal`).join(", "));
      items.forEach((it, i) => {
        const rad = mid - sw / 2 - 2 - i * (sw + gap);
        const C = 2 * Math.PI * rad;
        const p = Math.min(1, Math.max(0, it.p));
        const track = document.createElementNS(svgNS, "circle");
        Object.entries({ cx: mid, cy: mid, r: rad, fill: "none", stroke: RING[it.key], "stroke-opacity": 0.2, "stroke-width": sw }).forEach(([k, v]) => track.setAttribute(k, v));
        svg.append(track);
        if (p > 0.004) {
          const arc = document.createElementNS(svgNS, "circle");
          Object.entries({ cx: mid, cy: mid, r: rad, fill: "none", stroke: RING[it.key], "stroke-width": sw, "stroke-linecap": "round",
            "stroke-dasharray": C.toFixed(2), transform: `rotate(-90 ${mid} ${mid})`, class: "ring-progress" }).forEach(([k, v]) => arc.setAttribute(k, v));
          arc.style.strokeDashoffset = C.toFixed(2);
          arc.dataset.offset = (C * (1 - p)).toFixed(2);
          arc.style.transitionDelay = `${150 + i * 180}ms`;
          svg.append(arc);
        }
      });
      const keys = h("div", { class: "ring-keys" }, items.map((it) => {
        const pct = Math.round(it.p * 100);
        return h("div", { class: "ring-key", "data-ring": it.key }, [
          h("span", { class: "key-dot", style: `background:${RING[it.key]}` }),
          h("div", {}, [
            h("div", { class: "key-label" }, [it.label, h("span", { class: "key-pct" + (pct >= 100 ? " done" : ""), text: pct >= 100 ? "Goal reached" : `${pct}% of goal` })]),
            h("div", { class: "key-value" }, [it.value + " ", h("span", { class: "key-goal", text: it.goal })])]),
        ]);
      }));
      const card = h("section", { class: "card hero", "data-section": "rings" }, [keys]);
      card.prepend(svg);
      return card;
    },

    tiles(r, earlier, last) {
      const c = cfg, unit = c.DISTANCE_UNIT;
      const defs = [
        { key: "SUM_TIME", label: "Ride time", field: "elapsedS", val: (x) => [fmtDuration(x), ""], delta: (d) => fmtDuration(d) },
        { key: "SUM_TARGET", label: `At ${r.targetRpm}+ RPM`, field: "atTargetS", val: (x) => [fmtDuration(x), ""], delta: (d) => fmtDuration(d) },
        { key: "SUM_DISTANCE", label: "Distance", field: "distanceM", val: (x) => { const d = fmtDistance(x, unit); return [d.value, d.unit]; }, delta: (d) => { const x = fmtDistance(d, unit); return `${x.value} ${x.unit}`; } },
        { key: "SUM_AVG_RPM", label: "Average cadence", field: "avgRpm", val: (x) => [String(Math.round(x)), "RPM"], delta: (d) => `${Math.round(d)} RPM` },
        { key: "SUM_MAX_RPM", label: "Top cadence", field: "maxRpm", val: (x) => [String(Math.round(x)), "RPM"], delta: (d) => `${Math.round(d)} RPM` },
        { key: "SUM_STREAK", label: "Longest in the zone", field: "longestStreakS", val: (x) => [fmtDuration(x), ""], delta: (d) => fmtDuration(d) },
      ].filter((d) => c[d.key]);
      if (!defs.length) return null;
      const grid = h("div", { class: "tiles", "data-section": "tiles" });
      grid.style.setProperty("--cols", defs.length <= 4 ? defs.length : 3);
      grid.append(...defs.map((d) => {
        const v = r[d.field];
        const [value, u] = d.val(v);
        const label = h("div", { class: "t-label", text: d.label });
        // "Best yet" only when the improvement is big enough to see in the numbers shown
        const prevBest = earlier.length ? Math.max(...earlier.map((p) => p[d.field])) : Infinity;
        if (c.SUM_COMPARE && v > prevBest && d.delta(v - prevBest) !== d.delta(0)) label.append(h("span", { class: "best", text: "Best yet" }));
        const tile = h("div", { class: "stat-tile", "data-tile": d.field }, [label, h("div", { class: "t-value" }, [value, u ? " " : "", u ? h("span", { class: "t-unit", text: u }) : null])]);
        if (c.SUM_COMPARE && last) {
          const diff = v - last[d.field];
          const shown = d.delta(Math.abs(diff));
          const same = shown === d.delta(0);
          tile.append(h("div", { class: "t-delta" + (diff > 0 && !same ? " up" : ""), text: same ? "Same as last ride" : diff > 0 ? `▲ ${shown} more than last ride` : `${shown} less than last ride` }));
        }
        return tile;
      }));
      return grid;
    },

    awardsCard(awards) {
      return h("section", { class: "card", "data-section": "awards" }, [
        h("h2", { class: "card-title", text: awards.length === 1 ? "1 award" : `${awards.length} awards` }),
        h("div", { class: "medals" }, awards.map((a, i) => {
          const m = h("div", { class: "medal", "data-award": a.id }, [
            h("div", { class: `medal-disc medal-${a.medal}`, html: `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPHS[a.icon] || GLYPHS.star}</svg>` }),
            h("div", { class: "medal-title", text: a.title }),
            h("div", { class: "medal-detail", text: a.detail }),
          ]);
          m.style.transitionDelay = `${i * 110}ms`;
          return m;
        })),
      ]);
    },

    // ---------- charts (drawn at the card's real width) ----------
    drawCharts() {
      const cad = $("chart-cadence"), rec = $("chart-recent");
      if (cad) this.cadenceChart(cad, this.ride);
      if (rec) this.recentChart(rec, this.recentData || [this.ride]);
    },

    tip(box, html, x, y) {
      let t = box.querySelector(".viz-tip");
      if (!t) { t = h("div", { class: "viz-tip", role: "status" }); box.append(t); }
      if (html == null) { t.classList.remove("show"); return; }
      t.innerHTML = html;
      t.style.left = Math.min(Math.max(x, 60), box.clientWidth - 60) + "px";
      t.style.top = y + "px";
      t.classList.add("show");
    },

    cadenceChart(box, r) {
      box.textContent = "";
      const s = r.samples;
      if (s.length < 2) { box.append(h("div", { class: "empty-note", text: "The ride was too short for a chart." })); return; }
      const W = Math.max(280, box.clientWidth), H = 220, L = 36, R = 12, T = 12, B = 28;
      const every = r.sampleEveryS, span = s.length * every;
      const yMax = Math.ceil(Math.max(r.targetRpm + 20, Math.max(...s) + 5) / 20) * 20;
      const x = (t) => L + (t / span) * (W - L - R), y = (v) => T + (1 - v / yMax) * (H - T - B);
      const pts = s.map((v, i) => [x((i + 0.5) * every), y(v)]);
      let line = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {        // smooth Catmull-Rom curve, kept inside the chart
        const p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p2 = pts[i], p3 = pts[i + 1] || p2;
        const cl = (v) => Math.min(y(0), Math.max(T, v));
        line += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${cl(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${cl(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      const area = `${line} L${pts[pts.length - 1][0].toFixed(1)},${y(0)} L${pts[0][0].toFixed(1)},${y(0)} Z`;
      const yTicks = [];
      for (let v = 0; v <= yMax; v += yMax > 100 ? 40 : 20) yTicks.push(v);
      const mins = span / 60, stepMin = [1, 2, 5, 10, 15, 20, 30, 60].find((m) => mins / m <= 6) || 120;
      const xTicks = [];
      for (let m = 0; m <= mins + 1e-9; m += stepMin) xTicks.push(m);
      const ty = y(r.targetRpm);
      box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Cadence during the ride, average ${Math.round(r.avgRpm)} RPM, top ${Math.round(r.maxRpm)} RPM">
        <rect x="${L}" y="${T}" width="${W - L - R}" height="${(ty - T).toFixed(1)}" fill="${RING.target}" fill-opacity="0.12"/>
        ${yTicks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(255,255,255,${v === 0 ? 0.22 : 0.08})" stroke-width="1"/><text x="${L - 8}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${v}</text>`).join("")}
        <line x1="${L}" x2="${W - R}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${RING.target}" stroke-width="1.5"/>
        <text x="${W - R - 4}" y="${(ty + 16).toFixed(1)}" text-anchor="end">Target ${r.targetRpm} RPM</text>
        ${xTicks.map((m) => `<text x="${x(m * 60).toFixed(1)}" y="${H - 8}" text-anchor="middle">${m} min</text>`).join("")}
        <path d="${area}" fill="${RING.time}" fill-opacity="0.12"/>
        <path d="${line}" fill="none" stroke="${RING.time}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <g class="hover" opacity="0"><line y1="${T}" y2="${y(0)}" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><circle r="5" fill="${RING.time}" stroke="#1c1c1e" stroke-width="2"/></g>
        <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
      </svg>`;
      const hover = box.querySelector(".hover"), hit = box.querySelector(".hit");
      const move = (e) => {
        const bx = box.getBoundingClientRect();
        const px = ((e.clientX - bx.left) / bx.width) * W;
        const i = Math.min(s.length - 1, Math.max(0, Math.floor(((px - L) / (W - L - R)) * s.length)));
        const [cx, cy] = pts[i];
        hover.setAttribute("opacity", "1");
        hover.querySelector("line").setAttribute("x1", cx); hover.querySelector("line").setAttribute("x2", cx);
        hover.querySelector("circle").setAttribute("cx", cx); hover.querySelector("circle").setAttribute("cy", cy);
        this.tip(box, `<b>${Math.round(s[i])} RPM</b> at ${fmtDuration(i * every)}`, (cx / W) * bx.width, (cy / H) * bx.height);
      };
      hit.addEventListener("pointermove", move);
      hit.addEventListener("pointerdown", move);
      hit.addEventListener("pointerleave", () => { hover.setAttribute("opacity", "0"); this.tip(box, null); });
    },

    recentChart(box, rides) {
      box.textContent = "";
      const r = this.ride, goal = cfg.GOAL_TARGET_MIN;
      const W = Math.max(260, box.clientWidth), H = 200, L = 8, R = 8, T = 22, B = 28;
      const vals = rides.map((p) => p.atTargetS / 60);
      const yMax = Math.max(goal, ...vals) * 1.15 || 1;
      const slot = (W - L - R) / rides.length, bw = Math.min(24, slot * 0.6);
      const y = (v) => T + (1 - v / yMax) * (H - T - B);
      const bars = rides.map((p, i) => {
        const v = vals[i], cx = L + slot * (i + 0.5), top = y(v), base = y(0), hgt = Math.max(0, base - top);
        const rr = Math.min(4, hgt, bw / 2);
        const path = hgt < 0.5 ? "" : `M${cx - bw / 2},${base} V${top + rr} Q${cx - bw / 2},${top} ${cx - bw / 2 + rr},${top} H${cx + bw / 2 - rr} Q${cx + bw / 2},${top} ${cx + bw / 2},${top + rr} V${base} Z`;
        const current = p.id === r.id;
        const showDate = current || i === 0 || rides.length <= 7;
        return `<g data-i="${i}"><path d="${path}" fill="${current ? RING.target : "rgba(255,255,255,0.26)"}"/>
          ${current ? `<text x="${cx}" y="${(top - 6).toFixed(1)}" text-anchor="middle" style="fill:#fff;font-weight:600">${fmtDuration(p.atTargetS)}</text>` : ""}
          ${showDate ? `<text x="${cx}" y="${H - 8}" text-anchor="middle">${current ? "Today" : fmtDate(p.startedAt, { day: "numeric", month: "short" })}</text>` : ""}
          <rect class="hit" x="${(cx - slot / 2).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${H - T - B}" fill="transparent"/></g>`;
      }).join("");
      const gy = y(goal);
      box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Minutes at target for recent rides">
        <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
        <line x1="${L}" x2="${W - R}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
        <text x="${L}" y="${(gy - 6).toFixed(1)}">Goal ${goal} min</text>${bars}</svg>`;
      box.querySelectorAll("g[data-i]").forEach((g) => {
        const i = Number(g.dataset.i), p = rides[i];
        const show = () => {
          const bx = box.getBoundingClientRect();
          const cx = (L + slot * (i + 0.5)) / W * bx.width, cy = y(vals[i]) / H * bx.height;
          this.tip(box, `<b>${fmtDuration(p.atTargetS)}</b> at ${p.targetRpm}+ RPM, ${fmtDate(p.startedAt, { day: "numeric", month: "short" })}`, cx, cy);
        };
        g.addEventListener("pointerenter", show);
        g.addEventListener("pointerdown", show);
        g.addEventListener("pointerleave", () => this.tip(box, null));
      });
    },

    renderActions(error) {
      const bar = $("sum-actions");
      bar.textContent = "";
      const btn = (text, cls, fn, attrs = {}) => { const b = h("button", { type: "button", class: "sum-btn " + cls, text, ...attrs }); b.addEventListener("click", fn); return b; };
      if (error) bar.append(h("span", { class: "sum-saved", style: "color:var(--red)", text: error }));
      if (this.mode === "new" && !this.decided) {
        const discard = btn("Don't save", "destructive", () => {
          if (discard.dataset.armed) { clearTimeout(this.confirmTimer); this.decided = true; RideStore.saveActive(null); this.close(); return; }
          discard.dataset.armed = "1"; discard.textContent = "Tap again to discard";
          this.confirmTimer = setTimeout(() => { delete discard.dataset.armed; discard.textContent = "Don't save"; }, 4000);
        }, { "data-action": "discard" });
        bar.append(discard, btn("Save ride", "primary", () => this.save(false), { "data-action": "save" }));
      } else if (this.mode === "new") {
        bar.append(h("span", { class: "sum-saved", text: "✓ Saved" }), btn("Done", "primary", () => this.close(), { "data-action": "done" }));
      } else {
        const del = btn("Delete ride", "destructive", () => {
          if (del.dataset.armed) { clearTimeout(this.confirmTimer); RideStore.remove(this.ride.id); this.close(); return; }
          del.dataset.armed = "1"; del.textContent = "Tap again to delete";
          this.confirmTimer = setTimeout(() => { delete del.dataset.armed; del.textContent = "Delete ride"; }, 4000);
        }, { "data-action": "delete" });
        bar.append(del, btn("Close", "primary", () => this.close(), { "data-action": "close" }));
      }
      const primary = bar.querySelector(".primary");
      if (primary && this.isOpen) primary.focus({ preventScroll: true });
    },
  };

  function exportRides() {
    const csv = ridesToCSV(RideStore.list, cfg.DISTANCE_UNIT);
    const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));   // BOM so Excel reads UTF-8

  // -------------------------------------------------------------------
  // Screen Wake Lock (with graceful fallback)
  // -------------------------------------------------------------------
  const Wake = {
    wanted: false,
    sentinel: null,
    warned: false,
    async request() {
      this.wanted = true;
      if (!("wakeLock" in navigator)) { this.fallback(); return; }
      if (this.sentinel || document.visibilityState !== "visible") return;
      try {
        this.sentinel = await navigator.wakeLock.request("screen");
        this.sentinel.addEventListener("release", () => { this.sentinel = null; this.render(); });
        this.render();
      } catch (err) {
        console.warn("Wake lock failed:", err.name, err.message);
        this.sentinel = null;
        this.fallback(err.name === "NotAllowedError" ? " (blocked – battery saver may be on)" : "");
      }
    },
    fallback(extra = "") {
      $("wake-note").textContent = "Screen may go to sleep" + extra;
      if (!this.warned) {
        this.warned = true;
        UI.showMessage("wake", "This browser can't keep the screen on by itself" + extra + ". Set the screen timeout to the longest setting in the device's display settings.", "info");
      }
    },
    render() { $("wake-note").textContent = this.sentinel ? "Screen stays on" : (this.wanted ? "Screen may go to sleep" : ""); },
    init() {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && this.wanted) this.request();
      });
    },
  };

  // -------------------------------------------------------------------
  // Fullscreen
  // -------------------------------------------------------------------
  const Fullscreen = {
    init() {
      const btn = $("btn-fullscreen");
      if (!document.fullscreenEnabled) { btn.hidden = true; return; }
      btn.addEventListener("click", () => this.toggle());
      document.addEventListener("fullscreenchange", () => {
        btn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
      });
    },
    toggle() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else {
        // Whole page, so the cadence display (and the Settings sheet) stay on top of the video.
        document.documentElement.requestFullscreen().catch((err) => {
          UI.showMessage("fs", "Fullscreen isn't available here (" + err.name + ").", "info");
        });
      }
    },
  };

  const Controls = {
    timer: null,
    init() {
      const wake = () => this.show();
      ["pointermove", "pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
      this.show();
    },
    show() {
      $("app").classList.remove("controls-hidden");

  // ---------- small DOM helper ----------
  function h(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "html") e.innerHTML = v;
      else if (k === "text") e.textContent = v;
      else e.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of [].concat(children)) if (c) e.append(c);
    return e;
  }
  const resolve = (x, c) => (typeof x === "function" ? x(c) : x);
  const getter = (def) => def.get || ((c) => c[def.key]);
  const setter = (def) => def.set || ((c, v) => ({ [def.key]: v }));
  function limitsFor(def, c) {
    const lim = def.key ? LIMITS[def.key] : {};
    return { min: resolve(def.min ?? lim.min, c), max: resolve(def.max ?? lim.max, c), step: def.step ?? lim.step };
  }
  function setEnabled(row, def) {
    const on = def.enabled ? !!def.enabled(cfg) : true;
    row.classList.toggle("disabled", !on);
    row.inert = !on;
  }

  // Press-and-hold repeats, like a native stepper.
  function holdToRepeat(btn, fn) {
    let t1 = null, t2 = null;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || btn.disabled) return;
      fn(); stop();
      t1 = setTimeout(() => { t2 = setInterval(() => { if (btn.disabled) stop(); else fn(); }, 90); }, 450);
    });
    ["pointerup", "pointerleave", "pointercancel", "blur"].forEach((ev) => btn.addEventListener(ev, stop));
    btn.addEventListener("click", (e) => { if (e.detail === 0) fn(); });   // keyboard Enter/Space
  }

  // ---------- row builders: each returns { el, update } ----------
  const Rows = {
    link(def) {
      const value = h("span", { class: "cell-value" });
      const el = h("button", { type: "button", class: "cell link", "data-link": def.page }, [
        h("span", { class: "tile", style: `background:${def.tint}`, html: ICONS[def.icon] }),
        h("span", { class: "cell-label", text: def.label }), value,
      ]);
      el.insertAdjacentHTML("beforeend", ICONS.chevronRight);
      el.addEventListener("click", () => SettingsSheet.push(def.page, el));
      return { el, update() { value.textContent = def.value ? def.value(cfg) : ""; } };
    },

    toggle(def) {
      const input = h("input", { type: "checkbox", role: "switch", class: "switch" });
      const el = h("label", { class: "cell", "data-row": def.key }, [h("span", { class: "cell-label", text: def.label }), input]);
      input.addEventListener("change", () => Settings.update({ [def.key]: input.checked }));
      return { el, update() { input.checked = !!cfg[def.key]; setEnabled(el, def); } };
    },

    stepper(def) {
      const value = h("span", { class: "cell-value", "aria-live": "polite" });
      const dec = h("button", { type: "button", class: "step-btn", "aria-label": `Decrease ${def.label}`, html: ICONS.minus });
      const inc = h("button", { type: "button", class: "step-btn", "aria-label": `Increase ${def.label}`, html: ICONS.plus });
      const el = h("div", { class: "cell", role: "group", "aria-label": def.label, "data-row": def.id || def.key }, [
        h("span", { class: "cell-label", text: def.label }), value,
        h("div", { class: "stepper" }, [dec, h("span", { class: "sep" }), inc]),
      ]);
      const change = (dir) => {
        const lim = limitsFor(def, cfg);
        const cur = getter(def)(cfg);
        const next = Math.min(lim.max, Math.max(lim.min, Number((cur + dir * lim.step).toFixed(6))));
        if (next !== cur) Settings.update(setter(def)(cfg, next));
      };
      holdToRepeat(dec, () => change(-1));
      holdToRepeat(inc, () => change(+1));
      return {
        el,
        update() {
          const lim = limitsFor(def, cfg), v = getter(def)(cfg);
          value.textContent = def.format ? def.format(v, cfg) : String(v);
          dec.disabled = v <= lim.min + 1e-9;
          inc.disabled = v >= lim.max - 1e-9;
          setEnabled(el, def);
        },
      };
    },

    slider(def) {
      const lim = limitsFor(def, cfg);
      const value = h("span", { class: "cell-value" });
      const input = h("input", { type: "range", class: "range", min: lim.min, max: lim.max, step: lim.step, "aria-label": def.label });
      const el = h("div", { class: "cell slider-cell", "data-row": def.id || def.key }, [
        h("div", { class: "slider-top" }, [h("span", { class: "cell-label", text: def.label }), value]), input,
      ]);
      const paint = (v) => {
        const p = (v - lim.min) / (lim.max - lim.min);
        input.style.setProperty("--p", `calc(${p.toFixed(4)} * (100% - 28px) + 14px)`);
        const text = def.format ? def.format(v) : String(v);
        value.textContent = text;
        input.setAttribute("aria-valuetext", text);
      };
      input.addEventListener("input", () => {
        const v = Number(input.value);
        if (def.onInput) { def.onInput(v); SettingsSheet.refreshPreviews(); } else Settings.update(setter(def)(cfg, v));
        paint(v);
      });
      return { el, update() { const v = getter(def)(cfg); input.value = String(v); paint(v); setEnabled(el, def); } };
    },

    segmented(def) {
      const thumb = h("span", { class: "seg-thumb" });
      const group = h("div", { class: "segmented", role: "radiogroup", "aria-label": def.label }, [thumb]);
      group.style.setProperty("--n", def.options.length);
      const buttons = def.options.map(([val, text]) => {
        const b = h("button", { type: "button", role: "radio", "data-value": val, text });
        b.addEventListener("click", () => Settings.update({ [def.key]: val }));
        b.addEventListener("keydown", (e) => {
          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
          const i = def.options.findIndex((o) => o[0] === cfg[def.key]);
          const n = (i + (e.key === "ArrowRight" ? 1 : -1) + def.options.length) % def.options.length;
          Settings.update({ [def.key]: def.options[n][0] });
          buttons[n].focus();
          e.preventDefault();
        });
        group.append(b);
        return b;
      });
      const el = h("div", { class: "cell seg-cell", "data-row": def.key }, [group]);
      return {
        el,
        update() {
          const i = Math.max(0, def.options.findIndex((o) => o[0] === cfg[def.key]));
          group.style.setProperty("--i", i);
          buttons.forEach((b, j) => { b.setAttribute("aria-checked", String(j === i)); b.tabIndex = j === i ? 0 : -1; });
        },
      };
    },

    preview(def) {
      const box = h("div", { class: "preview", "data-preview": def.mode, html: landscapeSVG() });
      const haze = h("div", { class: "pv-haze" }), glow = h("div", { class: "pv-glow" }), edge = h("div", { class: "pv-glow-edge" });
      const caption = h("div", { class: "preview-caption" });
      box.append(haze, glow, edge, caption);
      const svg = box.querySelector("svg");
      const el = h("div", { class: "cell preview-cell" }, [box]);
      return {
        el,
        update() {
          let look, text;
          if (def.mode === "clarity") {
            const r = SettingsSheet.previewRpm;
            const c = clarityTarget(r, false, cfg);
            look = lookFor(c, 0, cfg, 0.35);
            text = !cfg.VISUAL_REWARD ? "Visual reward is off"
              : c >= 0.999 ? `Full colour at ${r} RPM`
              : c <= 0.001 ? `Grey and hazy at ${r} RPM`
              : `Colour returning at ${r} RPM`;
          } else {
            look = lookFor(1, 1, cfg, 0.35);
            text = cfg.BONUS_GLOW ? `After ${fmtClock(cfg.BONUS_AFTER_SECONDS)} in the zone` : "Bonus glow is off";
          }
          svg.style.filter = look.filter === "none" ? "" : look.filter;
          haze.style.opacity = String(look.haze);
          glow.style.opacity = String(look.glow);
          edge.style.opacity = String(look.glow);
          caption.textContent = text;
        },
      };
    },

    action(def) {
      const el = h("button", { type: "button", class: "cell action" + (def.destructive ? " destructive" : ""), "data-row": def.id, text: def.label });
      let armed = false, timer = null;
      el.addEventListener("click", () => {
        if (def.confirm && !armed) {
          armed = true; el.textContent = def.confirm;
          timer = setTimeout(() => { armed = false; el.textContent = def.label; }, 4000);
          return;
        }
        clearTimeout(timer); armed = false; el.textContent = def.label;
        def.run();
        SettingsSheet.refresh();
      });
      return { el, update() { setEnabled(el, def); } };
    },

    history() {
      const list = h("div", { class: "history-list" });
      const fmt = { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" };
      return {
        el: list,
        update() {
          list.textContent = "";
          const rides = RideStore.list.slice().reverse();
          if (!rides.length) {
            list.append(h("div", { class: "cell empty", text: "No saved rides yet. Press Start ride on the ride screen, then Finish and Save ride." }));
            return;
          }
          for (const r of rides.slice(0, 300)) {
            const d = fmtDistance(r.distanceM, cfg.DISTANCE_UNIT);
            const title = h("span", { text: fmtDate(r.startedAt, fmt) });
            if (r.simulator) title.append(h("span", { class: "tag", text: "Simulator" }));
            const b = h("button", { type: "button", class: "cell link history-item", "data-ride": r.id }, [
              h("span", { class: "history-text" }, [title,
                h("span", { class: "history-sub", text: `${fmtDuration(r.elapsedS)} ride, ${fmtDuration(r.atTargetS)} at ${r.targetRpm}+, ${d.value} ${d.unit}` })]),
            ]);
            b.insertAdjacentHTML("beforeend", ICONS.chevronRight);
            b.addEventListener("click", () => Summary.open(r, "view"));
            list.append(b);
          }
        },
      };
    },

    reset() {
      const el = h("button", { type: "button", class: "cell destructive", "data-row": "RESET", text: "Reset all settings" });
      let armed = false, timer = null;
      const disarm = () => { armed = false; el.textContent = "Reset all settings"; };
      el.addEventListener("click", () => {
        if (!armed) {
          armed = true;
          el.textContent = "Tap again to reset everything";
          clearTimeout(timer);
          timer = setTimeout(disarm, 4000);
          return;
        }
        clearTimeout(timer);
        disarm();
        Settings.reset();
        SettingsSheet.previewRpm = cfg.TARGET_RPM - 10;
      });
      return { el, update() {} };
    },
  };

  const SettingsSheet = {
    el: null,
    pages: {},
    stack: [],
    rows: [],
    footers: [],
    previews: [],
    isOpen: false,
    previewRpm: DEFAULTS.TARGET_RPM - 10,
    openers: [],
    downOnBackdrop: false,
    closeTimer: null,

    init() {
      this.el = $("settings");
      this.previewRpm = cfg.TARGET_RPM - 10;
      const host = $("settings-pages");
      for (const [id, page] of Object.entries(PAGES)) host.append(this.buildPage(id, page));
      this.showOnly("main");
      Settings.onChange(() => this.refresh());

      $("btn-settings").addEventListener("click", () => this.open());
      this.el.addEventListener("cancel", (e) => { e.preventDefault(); this.close(); });   // Esc
      this.el.addEventListener("close", () => {
        if (this.isOpen) { this.el.classList.remove("open"); this.finishClose(); }   // closed some other way
        $("btn-settings").focus({ preventScroll: true });
      });
      // Click outside the panel closes it (only if the press also started outside).
      this.el.addEventListener("pointerdown", (e) => { this.downOnBackdrop = e.target === this.el; });
      this.el.addEventListener("click", (e) => { if (e.target === this.el && this.downOnBackdrop) this.close(); });
    },

    buildPage(id, page) {
      const isMain = id === "main";
      const scroll = h("div", { class: "page-scroll" });
      const nav = h("header", { class: "navbar" });
      if (!isMain) {
        const back = h("button", { type: "button", class: "nav-btn nav-back", html: ICONS.chevronLeft });
        back.append("Settings");
        back.addEventListener("click", () => this.pop());
        nav.append(back);
      } else {
        nav.append(h("span"));
      }
      nav.append(h("h2", { class: "nav-title", text: page.title }));
      const done = h("button", { type: "button", class: "nav-btn nav-done", "data-action": "done", text: "Done" });
      done.addEventListener("click", () => this.close());
      nav.append(done);

      if (isMain) scroll.append(h("h1", { class: "large-title", text: "Settings" }));
      for (const group of page.groups) {
        const body = h("div", { class: "group-body" + (group.icons ? " has-icons" : "") });
        const g = h("section", { class: "group" });
        if (group.header) g.append(h("h3", { class: "group-header", text: group.header }));
        g.append(body);
        for (const def of group.rows) {
          const row = Rows[def.type](def);
          body.append(row.el);
          this.rows.push(row);
          if (def.type === "preview") this.previews.push(row);
        }
        if (group.footer) {
          const f = h("p", { class: "group-footer" });
          g.append(f);
          this.footers.push({ el: f, text: group.footer });
        }
        scroll.append(g);
      }
      const el = h("section", { class: "page", "data-page": id }, [nav, scroll]);
      scroll.addEventListener("scroll", () => el.classList.toggle("scrolled", scroll.scrollTop > 24), { passive: true });
      this.pages[id] = { el, scroll, def: page };
      return el;
    },

    refresh() {
      this.rows.forEach((r) => r.update());
      this.footers.forEach((f) => { f.el.textContent = resolve(f.text, cfg); });
    },
    refreshPreviews() { this.previews.forEach((p) => p.update()); },

    showOnly(id) {
      for (const [pid, p] of Object.entries(this.pages)) {
        p.el.style.transition = "none";
        p.el.className = "page" + (pid === id ? " current" : "");
        p.el.inert = pid !== id;
        void p.el.offsetWidth;
        p.el.style.transition = "";
      }
      this.stack = [id];
    },

    top() { return this.pages[this.stack[this.stack.length - 1]]; },

    push(id, opener) {
      const from = this.top(), to = this.pages[id];
      if (!to || from === to) return;
      this.openers.push(opener);
      to.scroll.scrollTop = 0;
      to.el.classList.remove("scrolled");
      to.el.style.transition = "none";
      to.el.className = "page";
      void to.el.offsetWidth;
      to.el.style.transition = "";
      from.el.className = "page off-left";
      from.el.inert = true;
      to.el.className = "page current";
      to.el.inert = false;
      if (from.def.onLeave) from.def.onLeave();
      this.stack.push(id);
      if (to.def.onEnter) to.def.onEnter();
      this.refresh();
      to.el.querySelector(".nav-back").focus({ preventScroll: true });
    },

    pop() {
      if (this.stack.length < 2) return;
      const from = this.top();
      this.stack.pop();
      const to = this.top();
      if (from.def.onLeave) from.def.onLeave();
      from.el.className = "page";
      from.el.inert = true;
      to.el.className = "page current";
      to.el.inert = false;
      if (to.def.onEnter) to.def.onEnter();
      const opener = this.openers.pop();
      if (opener) opener.focus({ preventScroll: true });
    },

    open() {
      if (this.isOpen) return;
      clearTimeout(this.closeTimer);
      this.isOpen = true;
      this.showOnly("main");
      this.openers = [];
      this.refresh();
      if (!this.el.open) this.el.showModal();
      requestAnimationFrame(() => requestAnimationFrame(() => this.el.classList.add("open")));
      Controls.show();
    },

    close() {
      if (!this.isOpen) return;
      this.el.classList.remove("open");
      this.finishClose();
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      this.closeTimer = setTimeout(() => { if (this.el.open) this.el.close(); }, reduce ? 20 : 480);
    },

    finishClose() {
      this.isOpen = false;
      const top = this.top();
      if (top && top.def.onLeave) top.def.onLeave();
      Effects.preview.rpm = null;
      Effects.preview.glow = false;
      Store.flush();
      Controls.show();
    },
  };

  // -------------------------------------------------------------------
  // App wiring and main loop
  // -------------------------------------------------------------------
  const App = {
    showUnsupported() {
      if (!window.isSecureContext) {
        UI.showMessage("support", "Bluetooth needs a secure page. Open this app from its https:// address (or http://localhost while testing). The simulator still works.", "error");
      } else {
        UI.showMessage("support", "This browser can't connect to the bike. Please use Google Chrome on an Android tablet, a Mac, Windows or a Chromebook. Safari, iPhone/iPad and Firefox don't support Bluetooth for web pages. The simulator still works.", "error");
      }
      UI.setStatus("Bluetooth not available", "error");
    },

    refreshStatus() {
      const connectBtn = $("btn-connect"), reBtn = $("btn-reconnect"), discBtn = $("btn-disconnect");
      if (!Bike.supported()) {
        connectBtn.hidden = false; reBtn.hidden = true; discBtn.hidden = true;
        return;
      }
      const s = Bike.state;
      connectBtn.hidden = s === "connected" || s === "connecting" || s === "reconnecting";
      connectBtn.textContent = Bike.device ? "Choose bike…" : "Connect bike";
      connectBtn.classList.toggle("primary", !Bike.device);
      reBtn.hidden = !(Bike.device && (s === "idle" || s === "reconnecting"));
      reBtn.textContent = s === "idle" ? "Reconnect" : "Reconnect now";
      discBtn.hidden = !(s === "connected" || s === "reconnecting" || s === "connecting");
      reBtn.classList.toggle("primary", !!Bike.device && s === "idle");
    },

    renderStatus() {
      if (!Bike.supported()) return;
      const s = Bike.state;
      if (s === "requesting") UI.setStatus("Choose “AirBike” in the list…", "warn");
      else if (s === "connecting") UI.setStatus("Connecting…", "warn");
      else if (s === "reconnecting") UI.setStatus("Reconnecting…", "warn");
      else if (s === "connected") {
        const fresh = Bike.lastCadenceAt != null && performance.now() - Bike.lastCadenceAt <= cfg.DATA_TIMEOUT_MS;
        UI.setStatus(fresh ? "Bike connected" : "Bike connected · no data", fresh ? "ok" : "warn");
      } else UI.setStatus("Bike not connected", "idle");
    },

    applySettings() {
      UI.initBar();
      Controls.show();
    },

    lastTick: performance.now(),
    tick() {
      const now = performance.now();
      const dt = Math.min((now - App.lastTick) / 1000, 1);
      App.lastTick = now;
      const cad = effectiveCadence({
        simulatorOn: Sim.on, simulatorRpm: Sim.rpm,
        bikeRpm: Bike.lastCadence, bikeRpmAt: Bike.lastCadenceAt, now,
      }, cfg);
      const target = targetRateForCadence(cad.rpm, cfg);
      VideoController.tick(dt, target);
      Effects.update({ rpm: cad.rpm, dt });
      UI.renderCadence(cad, VideoController.state, VideoController.hasVideo, Effects.zone.inZone);
      // Distance uses the speed the bike itself reports; the simulator uses the same rule as the sketch.
      const fresh = cad.source === "bike" && !cad.stale && typeof Bike.lastSpeed === "number";
      Session.update({
        rpm: cad.rpm, speedKmh: fresh ? Bike.lastSpeed : speedFromCadence(cad.rpm, cfg),
        simulator: cad.source === "simulator", inZone: Effects.zone.inZone, zoneStreakS: Effects.zone.streak, bonus: Effects.bonus,
      }, Math.min((now - App.lastSessionTick) / 1000, 60));   // real elapsed time, even if the browser slowed the timer
      App.lastSessionTick = now;
      App.renderStatus();
    },
    lastSessionTick: performance.now(),

    init() {
      UI.initBar();
      VideoController.init();
      Effects.init();
      Wake.init();
      Fullscreen.init();
      Controls.init();
      RideStore.load();
      Summary.init();
      SettingsSheet.init();
      Settings.onChange(() => App.applySettings());
      Settings.onChange(() => Session.render());

      Bike.onChange = () => {
        App.refreshStatus();
        if (Bike.state !== "connected") Controls.show();   // bring the buttons back if the bike drops
      };
      // Keep messages just below the toolbar, however many rows it wraps to.
      const placeMessages = () => { $("messages").style.top = ($("topbar").offsetHeight + 4) + "px"; };
      if ("ResizeObserver" in window) new ResizeObserver(placeMessages).observe($("topbar"));
      placeMessages();
      if (!Bike.supported()) App.showUnsupported();
      App.refreshStatus();

      $("btn-connect").addEventListener("click", () => { Wake.request(); Bike.choose(); });
      $("btn-reconnect").addEventListener("click", () => { Wake.request(); Bike.reconnectNow(); });
      $("btn-disconnect").addEventListener("click", () => Bike.disconnect());
      $("btn-video").addEventListener("click", () => { Wake.request(); $("file-input").click(); });
      $("file-input").addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) VideoController.load(file);
        e.target.value = "";   // allow choosing the same file again
      });
      $("btn-sim").addEventListener("click", () => { Wake.request(); Sim.toggle(); });
      $("sim-slider").addEventListener("input", (e) => Sim.set(e.target.value));
      Sim.set($("sim-slider").value);
      $("btn-start").addEventListener("click", () => { Wake.request(); Session.start(); });
      $("btn-pause").addEventListener("click", () => Session.togglePause());
      $("btn-finish").addEventListener("click", () => Session.finish());
      window.addEventListener("pagehide", () => { Store.flush(); Session.persist(); });

      Session.render();
      Session.restore();
      setInterval(App.tick, cfg.CONTROL_TICK_MS);
    },
  };

  window.AirBikeApp = { Bike, Sim, VideoController, UI, App, Effects, Settings, SettingsSheet, Store, cfg, RideStore, Session, Summary };   // for debugging in DevTools
  App.init();
})();
</script>
</body>
</html>
